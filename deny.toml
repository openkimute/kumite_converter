# cargo deny check (run by check.sh push and the git pre-push hook): advisories, licenses, bans, sources.
[graph]
all-features = false

[advisories]

[licenses]
# Permissive licenses only (kumite_converter is MIT OR Apache-2.0).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "MPL-2.0", "0BSD", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
