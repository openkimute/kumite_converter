# The tools: the Tekken 3 converter, the Tekken 2 converter, Counter-Strike levels, the local web server (README.md).
[workspace]
members = ["conv_io", "np_portable", "psx_media", "t3_converter", "t2_converter", "cs_levels", "convert", "convert_web", "serve"]
resolver = "3"

[workspace.package]
# the release's version: a tag vX.Y.Z must match it (.github/workflows/release.yml)
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
libm = "0.2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
debug = 1

# The release binaries (dist.sh): one standalone file per platform, smaller and a little faster; the same output.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
strip = true

# The browser's converter (convert_web/build.sh): as dist, but its symbols stay: stripping drops the wasm's
# target_features section, without which wasm-bindgen refuses the JSPI build (it removes the names itself).
[profile.web]
inherits = "dist"
strip = "debuginfo"

[profile.dev]
opt-level = 2
